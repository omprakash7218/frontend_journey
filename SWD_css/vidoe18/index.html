<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS BoxModel</title>
    <style>
        .box1{
            background-color: chartreuse;
            margin : 25px;
            padding: 12px;
            border: 2px solid black;
            height: 100px;
            color: blue;
            box-sizing: border-box;

        }
        .box2{
            color: black;
            background-color: chartreuse;
            margin: 35px;    
            padding: 12px;
            border: 2px solid blue;
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">I am a box</div>

    <div class="box box2">I am also a box</div><!--MARGIN COLLAPSE - MEANS MAX OF THE TWO ALTERNATE BOXES-->

</body>
</html>
