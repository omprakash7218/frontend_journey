<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATION IN CSS</title>
    <link rel="stylesheet" href="level8.css">

</head>
<body>
    <h1>Animation in CSS</h1>
    <div></div>

    <!-- Animation Properties  -->
    <!-- animation-name  @keyframes (name)-->
    <!-- animation-duration  s ms -->
    <!-- animation-timing-function ease-in , steps etc -->
    <!-- animation-delay  s ms-->
    <!-- animation-iteration-count  5 3 infinite-->
    <!-- animation-direction  reverse , normal, alternate , alternate-reverse -->

    <!-- %animation -->
     @keyframes name {
        0% {font-size : 20px;}
        x% {font-size : 30px;}
        100% {font-size : 40px;}
     }
     

</body>
</html>
